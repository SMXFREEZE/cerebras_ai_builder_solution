name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Starter lint
        run: pnpm --filter @asset-tracking/starter lint

      - name: Starter typecheck
        run: pnpm --filter @asset-tracking/starter typecheck

      - name: Starter tests
        run: pnpm --filter @asset-tracking/starter test

      - name: Starter build
        run: pnpm --filter @asset-tracking/starter build

      - name: API tests
        run: pnpm --filter @asset-tracking/api test
